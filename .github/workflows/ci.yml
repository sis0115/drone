name: CI

# Vercel 배포는 빌드만 본다. 여기서 perf 예산과 Playwright까지 막아야
# 깨진 화면이 프리뷰로 나가지 않는다.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 타입 체크
        run: npm run typecheck

      - name: 빌드
        run: npm run build

      - name: 헤드리스 씬 검증
        run: npm run harness

      - name: 성능 예산 (드로우콜 < 120)
        run: npm run perf

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 브라우저 검증
        run: npm test

      # 스크린샷은 세션 간 눈으로 확인하는 산출물이다. 실패해도 남긴다.
      - name: 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: tests/__screenshots__/
          if-no-files-found: warn
          retention-days: 14

      - name: 실패 트레이스 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-${{ github.sha }}
          path: test-results/
          retention-days: 7
